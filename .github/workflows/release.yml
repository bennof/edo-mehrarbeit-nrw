# Testet jeden Push und Pull Request. Ein Tag v* (z. B. v0.2.0) baut zusätzlich ein Release
# mit der gebauten SPA als ZIP; der Text der Tag-Nachricht wird zur Release-Beschreibung.
# Manuell gestartet (Actions → Release → Run workflow) ist es ein Testlauf: ZIP und Release-Text
# entstehen genauso, landen aber nur als Artefakt am Lauf – ohne Release.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag passt zur Version in package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Testlauf: kein Tag, der Name kommt aus package.json
          [ "$GITHUB_REF_TYPE" = tag ] || exit 0
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: ZIP und Release-Text erstellen
        run: |
          (cd build && zip -r "../edo-mehrarbeit-nrw-$VERSION.zip" .)
          # Checkout legt den Tag ohne Nachricht an – annotierten Tag nachladen.
          # Im Testlauf den Tag zur Version nehmen, falls es ihn schon gibt.
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION" || true
          git tag -l --format='%(contents)' "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Testlauf – Ergebnis als Artefakt
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-test-${{ env.VERSION }}
          path: |
            edo-mehrarbeit-nrw-${{ env.VERSION }}.zip
            release-notes.md

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'workflow_dispatch'
        with:
          files: edo-mehrarbeit-nrw-${{ env.VERSION }}.zip
          body_path: release-notes.md
          generate_release_notes: true
          # Versionen mit Bindestrich (-alpha, -beta, -rc) als Vorabversion markieren
          prerelease: ${{ contains(github.ref_name, '-') }}
